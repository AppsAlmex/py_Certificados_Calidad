name: Release lunes (dev -> main)

# Suelta a main SOLO los lunes 07:00 (hora de Mexico, UTC-6 => 13:00 UTC).
# 1. Si hay PR abierto dev -> main, lo mergea (los checks deben estar verdes;
#    asi lo exige la proteccion de main).
# 2. BLINDAJE: haya o no PR (aunque lo hayas mergeado a mano), si main tiene
#    commits nuevos sobre el ultimo tag, calcula y crea el tag igual. Si main no
#    trae nada nuevo, no hace nada.
# 3. Calcula el siguiente tag por Conventional Commits desde el ultimo tag:
#      - algun 'feat!:' o 'BREAKING CHANGE'  -> major (2.0.0)
#      - algun 'feat:'                       -> minor (1.3.0)
#      - solo fix/chore/docs/...             -> patch (1.2.4)
#    Una etiqueta 'major'/'minor'/'patch' en el PR fuerza el bump (override).
#    Crea el tag -> el tag dispara build.yml (Release del .exe).
#
# Requiere el secret RELEASE_PAT (fine-grained PAT de este repo con
# Contents: Read/Write y Pull requests: Read/Write). Se usa en vez del
# GITHUB_TOKEN porque los push hechos con GITHUB_TOKEN NO disparan otros
# workflows (el tag no lanzaria el build).
on:
  schedule:
    - cron: "0 13 * * 1"   # Lunes 13:00 UTC = 07:00 America/Mexico_City (UTC-6)
  workflow_dispatch:        # permite dispararlo a mano para probar

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Buscar PR dev -> main y decidir el bump
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev \
                --state open --json number --jq '.[0].number // empty')
          label_bump=""
          if [ -n "$num" ]; then
            # Hay PR abierto: se mergeara y su etiqueta (si tiene) fuerza el bump.
            labels=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' || true)
            echo "$labels" | grep -qx patch && label_bump=patch || true
            echo "$labels" | grep -qx minor && label_bump=minor || true
            echo "$labels" | grep -qx major && label_bump=major || true
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "num=$num"   >> "$GITHUB_OUTPUT"
            echo "PR #$num abierto -> label_bump='${label_bump:-<auto>}'"
          else
            # Blindaje: sin PR abierto (p.ej. lo mergeaste a mano) NO abortamos;
            # el tag se calcula directo sobre main si tiene commits nuevos.
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No hay PR abierto dev -> main. Se intentara tag directo sobre main."
          fi
          echo "label_bump=$label_bump" >> "$GITHUB_OUTPUT"

      - name: Mergear PR a main
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.num }}" --repo "$GITHUB_REPOSITORY" --merge

      - name: Crear el tag (semver por Conventional Commits)
        # Sin gate por 'found': taggea aunque el PR ya se haya mergeado a mano,
        # mientras main tenga commits nuevos sobre el ultimo tag (idempotente).
        env:
          LABEL_BUMP: ${{ steps.pr.outputs.label_bump }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git pull origin main

          latest=$(git tag -l 'v*' | sort -V | tail -1)
          [ -z "$latest" ] && latest="v0.0.0"

          # Rango de commits desde el ultimo tag (o todo si no hay tags).
          if git rev-parse -q --verify "refs/tags/${latest}" >/dev/null; then
            range="${latest}..HEAD"
          else
            range="HEAD"
          fi

          # Si main no tiene nada nuevo sobre el ultimo tag, no hay release.
          if [ "$(git rev-list --count $range)" -eq 0 ]; then
            echo "main sin commits nuevos sobre ${latest}. Nada que taggear."
            exit 0
          fi

          subjects=$(git log $range --no-merges --format='%s')
          bodies=$(git log $range --format='%B')

          # Decidir bump por Conventional Commits.
          cc_bump=patch
          if printf '%s\n' "$bodies" | grep -qE 'BREAKING CHANGE' \
             || printf '%s\n' "$subjects" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            cc_bump=major
          elif printf '%s\n' "$subjects" | grep -qiE '^feat(\([^)]+\))?:'; then
            cc_bump=minor
          fi

          # La etiqueta del PR (si existe) gana; si no, manda Conventional Commits.
          bump="${LABEL_BUMP:-}"
          [ -z "$bump" ] && bump="$cc_bump"

          ver="${latest#v}"
          IFS='.' read -r MA MI PA <<< "$ver"
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          new="v${MA}.${MI}.${PA}"
          echo "Ultimo tag: $latest | bump: $bump | nuevo: $new"
          git tag "$new"
          git push origin "$new"

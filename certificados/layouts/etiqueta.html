<!DOCTYPE html>
<!--
  PLANTILLA ETIQUETA 3x2 pulgadas.
  Edita libremente: HTML para la estructura, el <style> para los estilos.
  Campos disponibles en {{ d }} (ver certificados/labels.py: LabelData).
  Imagenes: {{ asset('logo.png') }} lee certificados/layouts/assets/.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @page { size: 3in 2in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 3in; height: 2in;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
    padding: 0.12in 0.14in;
  }
  .empresa {
    text-align: center;
    font-size: 9pt;
    font-weight: bold;
    border-bottom: 1.5px solid #000;
    padding-bottom: 2px;
    margin-bottom: 4px;
    line-height: 1.1;
  }
  table.datos { width: 100%; border-collapse: collapse; }
  table.datos td {
    font-size: 7.5pt;
    padding: 1px 0;
    vertical-align: top;
    line-height: 1.15;
  }
  td.lbl {
    font-weight: bold;
    white-space: nowrap;
    width: 0.85in;
    padding-right: 4px;
  }
  td.val { word-break: break-word; }
</style>
</head>
<body>
  <div class="empresa">{{ d.empresa }}</div>
  <table class="datos">
    <tr><td class="lbl">CLIENTE:</td><td class="val">{{ d.cliente }}</td></tr>
    <tr><td class="lbl">SUCURSAL:</td><td class="val">{{ d.sucursal }}</td></tr>
    <tr><td class="lbl">FECHA:</td><td class="val">{{ d.fecha }}</td></tr>
    <tr><td class="lbl">PRODUCTO:</td><td class="val">{{ d.producto }}</td></tr>
    <tr><td class="lbl">TRANSPORTE:</td><td class="val">{{ d.transporte }}</td></tr>
    <tr><td class="lbl">LOTE:</td><td class="val">{{ d.lote }}</td></tr>
    <tr><td class="lbl">EQUIPO:</td><td class="val">{{ d.equipo }}</td></tr>
  </table>
</body>
</html>

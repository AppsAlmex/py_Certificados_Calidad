[service]
host = https://fa-enkq-saasfaprod1.fa.ocs.oraclecloud.com
service_path = /xmlpserver/services/v2/ReportService
# read timeout (seg): debe cubrir la duracion del reporte. 70 min ~= 4200; deja margen.
timeout = 99999
# connect timeout (seg): tiempo para ABRIR conexion. Corto a proposito.
connect_timeout = 30
# true = valida el certificado TLS (recomendado, sin warnings). false solo si hay
# proxy/MITM que rompe la cadena; en ese caso el warning se silencia solo.
verify_ssl = true
# Reporte usado si .env no define CERT_REPORT
default_report = XXALMEX_CERTIFICADO_CALIDAD

[reports]
# clave = ruta absoluta del reporte (.xdo) en BI Publisher.
# Agrega aqui cada variante; eliges cual consumir con CERT_REPORT en .env.
XXALMEX_CERTIFICADO_CALIDAD = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDAD.xdo
XXALMEX_CERTIFICADO_CALIDAD_ORIGINAL = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDAD_ORIGINAL.xdo
XXALMEX_CERTIFICADO_CALIDADmejorasGetse = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDADmejorasGetse.xdo
XXALMEX_CERTIFICADO_CALIDADmejorasGetse_TRACKER = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDADmejorasGetse_TRACKER.xdo

[batch]
# Hilos concurrentes para procesar filas del CSV. 1 = secuencial (default).
# Subir para lanzar varias peticiones a Oracle en paralelo (reportes largos).
max_workers = 1

[catalogs]
# Listas valor/descripcion para los combos del formulario individual.
# Edita estos CSV (columnas: valor,descripcion) para personalizar las opciones.
dir = catalogos
formato = formato.csv
inspector = inspector.csv
planta_prod = planta.csv

[pdf]
# Motor de PDF: oracle = PDF original del RTF de BI Publisher (default).
#               local  = genera el PDF con nuestra plantilla HTML editable.
engine = oracle
page_format = Letter

[output]
output_dir = output

[logging]
log_dir = logs
log_level = INFO

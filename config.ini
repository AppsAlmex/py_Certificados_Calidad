[service]
host = https://fa-enkq-saasfaprod1.fa.ocs.oraclecloud.com
service_path = /xmlpserver/services/v2/ReportService
timeout = 99999
connect_timeout = 100
verify_ssl = true
default_report = XXALMEX_CERTIFICADO_CALIDAD

# Reportes de CERTIFICADOS (los que genera el usuario). Separados de los
# reportes que alimentan catalogos, que viven en [catalog_reports].
[reports]
XXALMEX_CERTIFICADO_CALIDAD = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDAD.xdo
XXALMEX_CERTIFICADO_CALIDAD_ORIGINAL = /Custom/Certificados_calidad/XXALMEX_CERTIFICADO_CALIDAD_ORIGINAL.xdo

# Reportes que ALIMENTAN catalogos (clave = campo del catalogo, valor = ruta .xdo).
# El reporte devuelve la lista valor/descripcion; el boton de la GUI actualiza el CSV.
# Deja el campo sin linea (o comentado) mientras no exista su reporte.
[catalog_reports]
inspector = /Custom/Certificados_calidad/XXALM_INSPECTORES_CALIDAD_RP.xdo
# formato = (pendiente: sin reporte aun)
# planta_prod = (pendiente: sin reporte aun)

[batch]
max_workers = 10

[catalogs]
dir = catalogos
formato = formato.csv
inspector = inspector.csv
planta_prod = planta.csv

[pdf]
engine = oracle
page_format = Letter

[output]
output_dir = output

[logging]
log_dir = logs
log_level = INFO

